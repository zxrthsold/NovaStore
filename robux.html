<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux — NOVA STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">

  <nav>
    <a href="index.html" class="logo">NOVA<span>STORE</span></a>
    <div class="links">
      <a href="robux.html">Robux</a>
      <a href="items.html">Items</a>
      <a href="info.html" class="info-icon" title="How it works & payment info">i</a>
    </div>
  </nav>

  <section style="padding-top:50px;">
    <div class="section-head">
      <div class="tag mono">Fixed rate · 1,000 minimum</div>
      <h2>Robux packages</h2>
      <p>To add or edit a package, find ROBUX_PACKAGES near the bottom of this file.</p>
    </div>
    <div class="pack-grid" id="packGrid"></div>
  </section>

  <footer>
    <div>NOVASTORE — Robux and Roblox items</div>
    <div style="margin-top:10px;"><a href="info.html">How it works & payment methods</a></div>
  </footer>

</div>

<script src="stars.js"></script>
<script>
  const DIAMOND_ICON = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 4 L40 18 L24 44 L8 18 Z" stroke="#f2f2f0" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8 18 H40 M17 18 L24 4 L31 18 M24 18 L18 44 M24 18 L30 44" stroke="#f2f2f0" stroke-width="1" opacity="0.55"/>
  </svg>`;

  // ============================================================
  // EDIT BELOW TO ADD / CHANGE ROBUX PACKAGES
  // Copy an existing line, change the values, save the file.
  // stock: "in" | "low" | "out"
  // ============================================================
  const ROBUX_PACKAGES = [
    { amount: "1,000 Robux", price: "£5.00", note: "$6.60 USD · €5.85 EUR", stock: "in", featured: true, link: "MONZO_LINK_1" },
    { amount: "2,000 Robux", price: "£9.50", note: "$12.50 USD · €11.10 EUR", stock: "out", featured: false, link: "MONZO_LINK_2" },
    { amount: "5,000 Robux", price: "£23.00", note: "$30.30 USD · €26.85 EUR", stock: "out", featured: false, link: "MONZO_LINK_3" }
  ];

  const stockLabel = { in: "In stock", low: "Low stock", out: "Sold out" };

  function renderPackages() {
    const grid = document.getElementById('packGrid');
    grid.innerHTML = ROBUX_PACKAGES.map(p => `
      <div class="pcard ${p.featured ? 'featured' : ''} ${p.stock === 'out' ? 'is-out' : ''}">
        ${p.featured && p.stock !== 'out' ? '<div class="badge">Best value</div>' : ''}
        <div class="icon-wrap">${DIAMOND_ICON}</div>
        <div class="pcard-body">
          <h3>${p.amount}</h3>
          <div class="price mono">${p.price}</div>
          <div class="note">${p.note}</div>
          <div class="stock ${p.stock}">${stockLabel[p.stock]}</div>
          ${p.stock === 'out'
            ? `<button class="btn btn-ghost btn-small" disabled style="opacity:.5;cursor:not-allowed;">Sold out</button>`
            : `<a href="${p.link}" target="_blank" class="btn btn-primary btn-small">Pay now</a>`
          }
        </div>
      </div>
    `).join('');
  }

  renderPackages();
</script>
</body>
</html>
