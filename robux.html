<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux — NOVA STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">

  <nav>
    <a href="index.html" class="logo">NOVA<span>STORE</span></a>
    <div class="links">
      <a href="robux.html">Robux</a>
      <a href="items.html">Items</a>
      <div class="lang-wrap">
        <button class="lang-btn" onclick="toggleLangMenu()" title="Change language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        </button>
        <div class="lang-menu" id="langMenu">
          <button onclick="setLanguage('en')">English</button>
          <button onclick="setLanguage('es')">Español</button>
          <button onclick="setLanguage('fr')">Français</button>
          <button onclick="setLanguage('de')">Deutsch</button>
          <button onclick="setLanguage('pt')">Português</button>
          <button onclick="setLanguage('ar')">العربية</button>
          <button onclick="setLanguage('hi')">हिन्दी</button>
          <button onclick="setLanguage('zh-CN')">中文</button>
          <button onclick="setLanguage('ja')">日本語</button>
        </div>
      </div>
      <a href="info.html" class="info-icon" title="How it works & payment info">i</a>
    </div>
  </nav>
  <div id="google_translate_element"></div>

  <section style="padding-top:50px;">
    <div class="section-head">
      <div class="tag mono">Fixed rate · 1,000 minimum</div>
      <h2>Robux packages</h2>
      <p>To add or edit a package, find ROBUX_PACKAGES near the bottom of this file.</p>
    </div>
    <div class="pack-grid" id="packGrid"></div>
  </section>

  <footer>
    <div>NOVASTORE — Robux and Roblox items</div>
    <div style="margin-top:10px;"><a href="info.html">How it works & payment methods</a></div>
  </footer>

</div>

<script src="stars.js"></script>
<script src="translate.js"></script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateInit"></script>
<script>
  const DIAMOND_ICON = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 4 L40 18 L24 44 L8 18 Z" stroke="#f2f2f0" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8 18 H40 M17 18 L24 4 L31 18 M24 18 L18 44 M24 18 L30 44" stroke="#f2f2f0" stroke-width="1" opacity="0.55"/>
  </svg>`;

  // ============================================================
  // EDIT BELOW TO ADD / CHANGE ROBUX PACKAGES
  // Copy an existing line, change the values, save the file.
  // stock: "in" | "low" | "out"
  // discount: leave "" for none, or e.g. "38% OFF"
  // links: paste your own Monzo, Revolut, PayPal.me links for each item
  // ============================================================
  const ROBUX_PACKAGES = [
    {
      amount: "1,000 Robux", price: "£5.00", note: "$6.60 USD · €5.85 EUR",
      stock: "in", featured: true, discount: "38% OFF RRP",
      links: { monzo: "https://monzo.me/joelayodeji/5.00?h=2_0UVm&account_type=personal", revolut: "REVOLUT_LINK_1", paypal: "" }
    },
    {
      amount: "2,000 Robux", price: "£9.50", note: "$12.50 USD · €11.10 EUR",
      stock: "out", featured: false, discount: "",
      links: { monzo: "MONZO_LINK_2", revolut: "REVOLUT_LINK_2", paypal: "PAYPAL_LINK_2" }
    },
    {
      amount: "5,000 Robux", price: "£23.00", note: "$30.30 USD · €26.85 EUR",
      stock: "out", featured: false, discount: "",
      links: { monzo: "MONZO_LINK_3", revolut: "REVOLUT_LINK_3", paypal: "PAYPAL_LINK_3" }
    }
  ];

  const PAYPAL_HANDLE = "@jalolegend";

  const stockLabel = { in: "In stock", low: "Low stock", out: "Sold out" };

  const methodHints = {
    monzo: "Also accepts Apple Pay and debit/credit card, not just bank transfer.",
    revolut: "Pay directly from the Revolut app.",
    paypal: "You'll get instructions after clicking Pay now — screen recording required."
  };

  function paymentRow(idx, links) {
    return `
      <div class="paymethod-row" data-idx="${idx}">
        <div class="paymethod-pill" data-method="monzo" onclick="selectMethod(${idx},'monzo')">Monzo</div>
        <div class="paymethod-pill" data-method="revolut" onclick="selectMethod(${idx},'revolut')">Revolut</div>
        <div class="paymethod-pill selected" data-method="paypal" onclick="selectMethod(${idx},'paypal')">
          <span class="rec">Recommended</span>PayPal F&F
        </div>
      </div>
      <div class="hint" id="methodhint-${idx}" style="margin-top:-4px;">${methodHints.paypal}</div>`;
  }

  function renderPackages() {
    const grid = document.getElementById('packGrid');
    grid.innerHTML = ROBUX_PACKAGES.map((p, idx) => `
      <div class="pcard ${p.featured ? 'featured' : ''} ${p.stock === 'out' ? 'is-out' : ''}">
        ${p.featured && p.stock !== 'out' ? '<div class="badge">Best value</div>' : ''}
        ${p.discount ? `<div class="discount-ribbon">${p.discount}</div>` : ''}
        <div class="icon-wrap">${DIAMOND_ICON}</div>
        <div class="pcard-body">
          <h3>${p.amount}</h3>
          <div class="price mono">${p.price}</div>
          <div class="note">${p.note}</div>
          <div class="stock ${p.stock}">${stockLabel[p.stock]}</div>
          ${p.stock === 'out'
            ? `<button class="btn btn-ghost btn-small" disabled style="opacity:.5;cursor:not-allowed;">Sold out</button>`
            : `${paymentRow(idx, p.links)}<a href="#" id="paybtn-${idx}" class="btn btn-primary btn-small" onclick="return payNow(${idx}, '${p.amount.replace(/'/g, "")}')">Pay now</a>`
          }
        </div>
      </div>
    `).join('');
  }

  const selectedMethods = {};

  function selectMethod(idx, method) {
    selectedMethods[idx] = method;
    document.querySelectorAll(`.paymethod-row[data-idx="${idx}"] .paymethod-pill`).forEach(el => {
      el.classList.toggle('selected', el.dataset.method === method);
    });
    const hintEl = document.getElementById(`methodhint-${idx}`);
    if (hintEl) hintEl.textContent = methodHints[method];
  }

  function payNow(idx, label) {
    const method = selectedMethods[idx] || 'paypal';
    const price = ROBUX_PACKAGES[idx].price;
    const code = 'ORD-' + Math.random().toString(36).slice(2, 8).toUpperCase();

    if (method === 'paypal') {
      showPurchaseBanner(code, label, method, price);
    } else {
      const link = ROBUX_PACKAGES[idx].links[method];
      window.open(link, '_blank');
      showPurchaseBanner(code, label, method, price);
    }
    return false;
  }

  function showPurchaseBanner(code, label, method, price) {
    let banner = document.getElementById('purchaseBanner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'purchaseBanner';
      banner.className = 'purchase-banner';
      document.body.appendChild(banner);
    }
    const paypalInstructions = method === 'paypal' ? `
      <div class="warn" style="text-align:left; max-width:480px;">
        <strong>PayPal instructions:</strong><br>
        1. Open PayPal and send <strong>${price}</strong> to <strong>${PAYPAL_HANDLE}</strong><br>
        2. Select <strong>Friends & Family</strong> — not Goods & Services<br>
        3. Screen record your whole phone/screen from before you open PayPal until the payment shows as sent<br>
        4. Attach that recording when you confirm your order below
      </div>` : '';
    banner.innerHTML = `
      <div class="code mono">${code}</div>
      <div class="note">This is your order code — <strong>please keep note of it</strong> (recommended, not required). All purchases are non-refundable.</div>
      ${paypalInstructions}
      <a class="btn btn-primary btn-small" style="width:auto; padding:12px 26px;" href="order.html?item=${encodeURIComponent(label)}&code=${code}&method=${method}">I've paid — confirm my order</a>
    `;
    banner.classList.add('show');
  }

  renderPackages();
</script>
</body>
</html>
