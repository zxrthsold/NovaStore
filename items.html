<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Items — NOVA STORE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">

  <nav>
    <a href="index.html" class="logo">NOVA<span>STORE</span></a>
    <div class="links">
      <a href="robux.html">Robux</a>
      <a href="items.html">Items</a>
      <a href="info.html" class="info-icon" title="How it works & payment info">i</a>
    </div>
  </nav>

  <section style="padding-top:50px;">
    <div class="section-head">
      <div class="tag mono">Blox Fruits</div>
      <h2>Game items</h2>
      <p>To add or edit an item, find ITEMS near the bottom of this file.</p>
    </div>
    <div class="item-grid" id="itemGrid"></div>
  </section>

  <footer>
    <div>NOVASTORE — Robux and Roblox items</div>
    <div style="margin-top:10px;"><a href="info.html">How it works & payment methods</a></div>
  </footer>

</div>

<script src="stars.js"></script>
<script>
  const ITEM_ICON = `<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="9" y="18" width="30" height="22" rx="1" stroke="#f2f2f0" stroke-width="1.6"/>
    <path d="M9 18 L24 8 L39 18" stroke="#f2f2f0" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M24 18 V40 M9 18 H39" stroke="#f2f2f0" stroke-width="1" opacity="0.5"/>
  </svg>`;

  // ============================================================
  // EDIT BELOW TO ADD / CHANGE ITEMS
  // Copy an existing line, change the values, save the file.
  // stock: "in" | "low" | "out"
  // ============================================================
  const ITEMS = [
    { name: "Item name", desc: "Blox Fruits — rarity/type here.", price: "£2.50", stock: "out", link: "MONZO_LINK_4" },
    { name: "Item name", desc: "Blox Fruits — rarity/type here.", price: "£4.00", stock: "out", link: "MONZO_LINK_5" },
    { name: "Item name", desc: "Blox Fruits — rarity/type here.", price: "£6.00", stock: "out", link: "MONZO_LINK_6" }
  ];

  const stockLabel = { in: "In stock", low: "Low stock", out: "Sold out" };

  function renderItems() {
    const grid = document.getElementById('itemGrid');
    grid.innerHTML = ITEMS.map(i => `
      <div class="pcard ${i.stock === 'out' ? 'is-out' : ''}">
        <div class="icon-wrap">${ITEM_ICON}</div>
        <div class="pcard-body">
          <h3>${i.name}</h3>
          <div class="desc">${i.desc}</div>
          <div class="price mono">${i.price}</div>
          <div class="stock ${i.stock}">${stockLabel[i.stock]}</div>
          ${i.stock === 'out'
            ? `<button class="btn btn-ghost btn-small" disabled style="opacity:.5;cursor:not-allowed;">Sold out</button>`
            : `<a href="${i.link}" target="_blank" class="btn btn-primary btn-small">Pay now</a>`
          }
        </div>
      </div>
    `).join('');
  }

  renderItems();
</script>
</body>
</html>
